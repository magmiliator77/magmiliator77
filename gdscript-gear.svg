<!-- Logo de GDScript (Godot Foundation, CC BY 4.0), vectorizado del
     original y animado. El engranaje da una vuelta completa por ciclo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17.8 -17.8 135.59 135.59" width="65" height="65" role="img" aria-label="GDScript">
  <style>
    /* El engranaje descansa, coge carrerilla hacia atras, da una vuelta
       completa, se pasa de largo y encaja. Vuelve a 360 = mismo sitio,
       asi el bucle es exacto y las letras quedan derechas en reposo. */
    .gear {
      animation: spin 6s infinite;
      transform-origin: 50px 50px;
    }
    @keyframes spin {
      0%        { transform: rotate(0deg) scale(1);      animation-timing-function: linear; }
      42%       { transform: rotate(0deg) scale(1);      animation-timing-function: cubic-bezier(.4,0,.7,.4); }
      47%       { transform: rotate(-9deg) scale(.975);  animation-timing-function: cubic-bezier(.5,0,.9,.5); }
      58%       { transform: rotate(130deg) scale(1);    animation-timing-function: linear; }
      72%       { transform: rotate(332deg) scale(1);    animation-timing-function: cubic-bezier(.2,.6,.4,1); }
      80%       { transform: rotate(371deg) scale(1.02); animation-timing-function: cubic-bezier(.3,0,.3,1); }
      86%       { transform: rotate(360deg) scale(1);    animation-timing-function: linear; }
      100%      { transform: rotate(360deg) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gear { animation: none; }
    }
  </style>
  <!-- Fondo, para igualar los cubos de techstack -->
  <rect x="-17.8" y="-17.8" width="135.59" height="135.59" rx="20.34" fill="#1C2128"/>
