<!-- Logo de Godot (Godot Foundation, CC BY 4.0), vectorizado del original
     y animado: parpadea y mira alrededor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14.11 -14.11 128.21 128.21" width="65" height="65" role="img" aria-label="Godot Engine">
  <style>
    /* Parpadeo: los ojos se aplastan contra su propia linea, el blanco queda
       reducido a una raya y asoma el azul de la cabeza que hay detras. */
    .eyes { animation: blink 6s infinite; transform-origin: 50px 50.74px; }
    @keyframes blink {
      0%, 20%   { transform: scaleY(1); }
      22%       { transform: scaleY(.08); }
      24%       { transform: scaleY(1); }
      26%       { transform: scaleY(.08); }
      28%, 72%  { transform: scaleY(1); }
      74%       { transform: scaleY(.08); }
      76%, 100% { transform: scaleY(1); }
    }
    /* Las pupilas cuelgan de .eyes, asi que se aplastan con el parpadeo.
       El recorrido de 2.8 cabe de sobra dentro de la esclerotica. */
    .pupils { animation: look 6s infinite; }
    @keyframes look {
      0%, 30%   { transform: translateX(0); }
      38%, 50%  { transform: translateX(-2.8px); }
      58%, 68%  { transform: translateX(2.8px); }
      76%, 100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eyes, .pupils { animation: none; }
    }
  </style>
