name: ghstats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: tiennm99/ghstats@v1
        with:
          user: ${{ github.repository_owner }}
          token: ${{ secrets.GHSTATS_TOKEN }}
          themes: radical
          tz: Europe/Madrid
          start_of_week: monday
          include_forks: "false"
          include_private: "true"
          include_org_repos: "false"
          commits_per_repo: "0"
          commit_changes: "false"

      # top-starred-repos.svg lista los repos propios por estrellas e incluye
      # los privados, exponiendo sus nombres en un repositorio público.
      - name: Descartar la tarjeta que expone nombres de repos privados
        run: rm -f output/*/top-starred-repos.svg

      - name: Commitear las tarjetas restantes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          git diff --staged --quiet || git commit -m "chore: update ghstats cards"
          git push
